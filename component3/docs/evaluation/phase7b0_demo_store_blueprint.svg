<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Phase 7B.0 synthetic supermarket evaluation blueprint</title>
  <desc id="description">Existing 20 by 14 metre demo geometry with six shelf blocks, three primary product aisles, four designated connecting lanes, all walkable graph edges, six pickups, three AprilTag checkpoints, entrance, checkout, and the verified two-product route.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #19362c; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: 700; }
      .lane { stroke: #8fa69a; stroke-width: 5; }
      .node { fill: #536d61; stroke: white; stroke-width: 2; }
      .shelf { fill: #c29a6b; stroke: #765434; stroke-width: 3; }
      .pickup { fill: #f2a51a; stroke: white; stroke-width: 3; }
      .checkpoint { fill: #7656b5; stroke: white; stroke-width: 3; }
      .route { fill: none; stroke: #148558; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
    </style>
    <circle id="node" class="node" r="6"/>
  </defs>
  <rect width="1200" height="800" fill="#f4f8f5"/>
  <text x="50" y="38" font-size="24" font-weight="700">Phase 7B.0 — Mac-camera evaluation blueprint</text>
  <text x="50" y="62" class="small">Derived without modification from comp3-synthetic-supermarket-demo-v1 · metric geometry · synthetic products</text>

  <!-- Map boundary: x=0..20 m, y=0..14 m; scale 40 px/m. -->
  <rect x="50" y="90" width="800" height="560" rx="8" fill="#fff" stroke="#446357" stroke-width="4"/>

  <!-- Three primary product aisles: y=4, 7, and 10 m. -->
  <g stroke="#d7ecdf" stroke-width="34">
    <line x1="90" y1="490" x2="810" y2="490"/>
    <line x1="90" y1="370" x2="810" y2="370"/>
    <line x1="90" y1="250" x2="810" y2="250"/>
  </g>

  <!-- Four designated connecting lanes: west, central, east, and checkout/rear. -->
  <g stroke="#e7efe9" stroke-width="34">
    <line x1="90" y1="610" x2="90" y2="130"/>
    <line x1="570" y1="610" x2="570" y2="130"/>
    <line x1="810" y1="610" x2="810" y2="130"/>
    <line x1="90" y1="130" x2="810" y2="130"/>
  </g>

  <!-- Complete existing walkable graph: five horizontal rows and three vertical spines. -->
  <g class="lane">
    <line x1="90" y1="610" x2="810" y2="610"/>
    <line x1="90" y1="490" x2="810" y2="490"/>
    <line x1="90" y1="370" x2="810" y2="370"/>
    <line x1="90" y1="250" x2="810" y2="250"/>
    <line x1="90" y1="130" x2="810" y2="130"/>
    <line x1="90" y1="610" x2="90" y2="130"/>
    <line x1="570" y1="610" x2="570" y2="130"/>
    <line x1="810" y1="610" x2="810" y2="130"/>
  </g>

  <!-- Verified Bananas → Frozen peas → checkout route. -->
  <polyline class="route" points="90,610 90,490 250,490 410,490 570,490 570,370 730,370 810,370 810,250 810,130"/>

  <!-- Six existing shelf polygons. -->
  <g class="shelf">
    <rect x="234" y="392" width="32" height="76"/><rect x="394" y="392" width="32" height="76"/><rect x="714" y="392" width="32" height="76"/>
    <rect x="234" y="272" width="32" height="76"/><rect x="394" y="272" width="32" height="76"/><rect x="714" y="272" width="32" height="76"/>
  </g>
  <g text-anchor="middle" class="small" font-weight="700">
    <text x="250" y="434">S1</text><text x="410" y="434">S2</text><text x="730" y="434">S3</text>
    <text x="250" y="314">S4</text><text x="410" y="314">S5</text><text x="730" y="314">S6</text>
  </g>

  <!-- All 30 graph nodes. -->
  <g>
    <use href="#node" x="90" y="610"/><use href="#node" x="250" y="610"/><use href="#node" x="410" y="610"/><use href="#node" x="570" y="610"/><use href="#node" x="730" y="610"/><use href="#node" x="810" y="610"/>
    <use href="#node" x="90" y="490"/><use href="#node" x="250" y="490"/><use href="#node" x="410" y="490"/><use href="#node" x="570" y="490"/><use href="#node" x="730" y="490"/><use href="#node" x="810" y="490"/>
    <use href="#node" x="90" y="370"/><use href="#node" x="250" y="370"/><use href="#node" x="410" y="370"/><use href="#node" x="570" y="370"/><use href="#node" x="730" y="370"/><use href="#node" x="810" y="370"/>
    <use href="#node" x="90" y="250"/><use href="#node" x="250" y="250"/><use href="#node" x="410" y="250"/><use href="#node" x="570" y="250"/><use href="#node" x="730" y="250"/><use href="#node" x="810" y="250"/>
    <use href="#node" x="90" y="130"/><use href="#node" x="250" y="130"/><use href="#node" x="410" y="130"/><use href="#node" x="570" y="130"/><use href="#node" x="730" y="130"/><use href="#node" x="810" y="130"/>
  </g>

  <!-- Product pickup nodes. -->
  <g class="pickup">
    <circle cx="250" cy="490" r="11"/><circle cx="410" cy="490" r="11"/><circle cx="730" cy="490" r="11"/>
    <circle cx="250" cy="370" r="11"/><circle cx="410" cy="370" r="11"/><circle cx="730" cy="370" r="11"/>
  </g>
  <g class="small" font-weight="700">
    <text x="267" y="485">P1</text><text x="427" y="485">P2</text><text x="747" y="485">P3</text>
    <text x="267" y="365">P4</text><text x="427" y="365">P5</text><text x="747" y="365">P6</text>
  </g>

  <!-- Demo AprilTag checkpoints. -->
  <g class="checkpoint">
    <rect x="77" y="597" width="26" height="26" rx="4"/><rect x="557" y="357" width="26" height="26" rx="4"/><rect x="797" y="117" width="26" height="26" rx="4"/>
  </g>
  <g class="label">
    <text x="108" y="630">Entrance · CP200</text>
    <text x="588" y="360">CP201</text>
    <text x="650" y="112">Checkout · CP202</text>
  </g>

  <g class="small">
    <text x="105" y="474">Aisle A · y=4 m</text>
    <text x="105" y="354">Aisle B · y=7 m</text>
    <text x="105" y="234">Aisle C · y=10 m</text>
    <text x="58" y="685">Coordinate origin: south-west · route distance computed on graph edges</text>
  </g>

  <!-- Explanation panel. -->
  <rect x="880" y="90" width="280" height="560" rx="10" fill="#fff" stroke="#cbd9d1" stroke-width="2"/>
  <text x="905" y="125" font-size="18" font-weight="700">Existing geometry</text>
  <text x="905" y="155" class="small">Boundary: 20 m × 14 m</text>
  <text x="905" y="178" class="small">Graph: 30 nodes · 37 edges</text>
  <text x="905" y="201" class="small">Shelf blocks: 6</text>
  <text x="905" y="224" class="small">Primary product aisles: 3</text>
  <text x="905" y="247" class="small">Designated connectors: 4</text>

  <text x="905" y="290" font-size="16" font-weight="700">Connector labels</text>
  <text x="905" y="316" class="small">C1 · west spine x=1 m</text>
  <text x="905" y="339" class="small">C2 · central spine x=13 m</text>
  <text x="905" y="362" class="small">C3 · east spine x=19 m</text>
  <text x="905" y="385" class="small">C4 · checkout lane y=13 m</text>

  <text x="905" y="430" font-size="16" font-weight="700">Legend</text>
  <line x1="905" y1="454" x2="950" y2="454" class="lane"/><text x="965" y="459" class="small">walkable graph</text>
  <line x1="905" y1="482" x2="950" y2="482" class="route"/><text x="965" y="487" class="small">verified route</text>
  <rect x="905" y="504" width="24" height="18" class="shelf"/><text x="965" y="519" class="small">shelf polygon</text>
  <circle cx="917" cy="548" r="10" class="pickup"/><text x="965" y="553" class="small">product pickup</text>
  <rect x="905" y="574" width="24" height="24" rx="4" class="checkpoint"/><text x="965" y="591" class="small">tag36h11 checkpoint</text>

  <text x="905" y="625" class="small" font-weight="700">No validated research-map change.</text>
</svg>
